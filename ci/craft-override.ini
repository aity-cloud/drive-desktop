# Craft config override for the Aity Drive desktop Factory, layered on top
# of the Pin's own .craft.ini by scripts/craft.sh / scripts/craft.ps1
# (upstream layers .github/workflows/craft_override.ini the same way).

[GeneralSettings]
# We consume upstream's public binary cache (download.owncloud.com, wired in
# the Pin's .craft.ini); this CI never produces cache files.
Packager/CreateCache = False

[BlueprintSettings]
# python2/breakpad are only needed to build the crash reporter, which the
# Aity Drive Branding keeps off (client defaults, decision 15), and python2
# is not installed in the build images anyway.
dev-utils/python2.ignored = True
dev-utils/breakpad-tools.ignored = True
